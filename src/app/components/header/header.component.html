<header class="sticky top-0 z-[100] w-full border-b border-slate-200 dark:border-slate-800 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <div class="flex items-center gap-3 cursor-pointer" (click)="scrollToTop()">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary text-white">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight">Diego Javier Soto</span>
    </div>

    <nav class="hidden md:flex items-center gap-8">
      <a class="text-sm font-medium hover:text-primary transition-colors" href="#about">{{ langService.t().about }}</a>
      <a class="text-sm font-medium hover:text-primary transition-colors" href="#projects">{{ langService.t().projects }}</a>
      <a class="text-sm font-medium hover:text-primary transition-colors" href="#skills">{{ langService.t().skills }}</a>
      <a class="text-sm font-medium hover:text-primary transition-colors" href="#experience">{{ langService.t().experience }}</a>
      <a class="text-sm font-medium hover:text-primary transition-colors" href="#contact">{{ langService.t().contact }}</a>
      
      <!-- Language Switch Pill -->
      <div class="flex items-center gap-1 p-1 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
        <button (click)="langService.setLanguage('es')" 
                [class]="langService.currentLang() === 'es' ? 'px-3 py-1.5 rounded-lg bg-primary text-white text-xs font-bold shadow-md transition-all cursor-pointer border-0' : 'px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 text-xs font-medium hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer border-0'">
          ES
        </button>
        <button (click)="langService.setLanguage('en')" 
                [class]="langService.currentLang() === 'en' ? 'px-3 py-1.5 rounded-lg bg-primary text-white text-xs font-bold shadow-md transition-all cursor-pointer border-0' : 'px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 text-xs font-medium hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer border-0'">
          EN
        </button>
      </div>
    </nav>

    <button (click)="toggleMenu()" aria-label="Abrir menú de navegación" class="md:hidden text-slate-900 dark:text-white p-2 focus:outline-none bg-transparent border-0 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </div> 
  
  @if (isMenuOpen) {
    <div class="md:hidden border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md px-6 py-8 space-y-6 shadow-2xl animate-in slide-in-from-top duration-300">
      <nav class="flex flex-col items-center gap-6">
        <button (click)="navigateTo('about')" class="text-xl font-semibold text-slate-700 dark:text-slate-200 hover:text-primary bg-transparent border-0 cursor-pointer">{{ langService.t().about }}</button>
        <button (click)="navigateTo('projects')" class="text-xl font-semibold text-slate-700 dark:text-slate-200 hover:text-primary bg-transparent border-0 cursor-pointer">{{ langService.t().projects }}</button>
        <button (click)="navigateTo('skills')" class="text-xl font-semibold text-slate-700 dark:text-slate-200 hover:text-primary bg-transparent border-0 cursor-pointer">{{ langService.t().skills }}</button>
        <button (click)="navigateTo('experience')" class="text-xl font-semibold text-slate-700 dark:text-slate-200 hover:text-primary bg-transparent border-0 cursor-pointer">{{ langService.t().experience }}</button>
        <button (click)="navigateTo('contact')" class="text-xl font-semibold text-slate-700 dark:text-slate-200 hover:text-primary bg-transparent border-0 cursor-pointer">{{ langService.t().contact }}</button>
      </nav>
      
      <div class="pt-6 border-t border-slate-100 dark:border-slate-800 flex justify-center">
        <div class="flex items-center gap-1 p-1 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-[200px] justify-center">
          <button (click)="langService.setLanguage('es')" 
                  [class]="langService.currentLang() === 'es' ? 'flex-1 px-4 py-2.5 rounded-lg bg-primary text-white text-sm font-bold shadow-md transition-all text-center cursor-pointer border-0' : 'flex-1 px-4 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 text-sm font-medium hover:text-slate-800 dark:hover:text-slate-200 transition-all text-center cursor-pointer border-0'">
            ES
          </button>
          <button (click)="langService.setLanguage('en')" 
                  [class]="langService.currentLang() === 'en' ? 'flex-1 px-4 py-2.5 rounded-lg bg-primary text-white text-sm font-bold shadow-md transition-all text-center cursor-pointer border-0' : 'flex-1 px-4 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 text-sm font-medium hover:text-slate-800 dark:hover:text-slate-200 transition-all text-center cursor-pointer border-0'">
            EN
          </button>
        </div>
      </div>
    </div>
  }
</header>
